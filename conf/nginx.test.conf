load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  server_tokens off;
  more_clear_headers Server;

  access_log off;

  client_max_body_size 0;

  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  ssl_ecdh_curve secp384r1;
  ssl_prefer_server_ciphers on;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_early_data on;

  http2 on;
  http3 on;
  quic_retry on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1;
  brotli_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  zstd on;
  zstd_comp_level 3;
  zstd_min_length 1;
  zstd_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Accept-Encoding "";

  proxy_read_timeout 86400;
  proxy_send_timeout 86400;
  proxy_request_buffering off;
  proxy_http_version 1.1;

  proxy_buffer_size 1m;
  proxy_buffers 8 1m;
  proxy_busy_buffers_size 2m;

  map $http_x_forwarded_for $ga_xff {
    default $http_x_forwarded_for;
    ""      "-";
  }

  map $upstream_cache_status $ga_cache {
    default $upstream_cache_status;
    ""      "-";
  }

  map $ssl_protocol $ga_ssl_proto {
    default $ssl_protocol;
    ""      "-";
  }

  map $ssl_cipher $ga_ssl_cipher {
    default $ssl_cipher;
    ""      "-";
  }

  map $sent_http_content_type $ga_mime {
    default $sent_http_content_type;
    ""      "-";
  }

  log_format log_stream
    '$remote_addr $ga_xff [$time_local] $host $remote_user $ga_cache '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    '$ga_ssl_proto $ga_ssl_cipher "$ga_mime" $request_time';

  modsecurity on;
  modsecurity_rules_file /etc/modsecurity/includes.conf;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    location /_gwhealthz {
      access_log off;
      default_type text/plain;
      return 200 "Nginx is running\n";
    }

    location /test-html {
      default_type text/html;
      return 200 '<html><head></head><body>Test page</body></html>';
    }

    location /test-gzip {
      default_type text/plain;
      return 200 "This response is used to verify that gzip compression is active and working correctly in the nginx configuration under test.\n";
    }

    location / {
      default_type text/plain;
      return 200 "OK\n";
    }
  }

  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name _;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # HTTP/3 uses the :authority pseudo-header instead of Host, so
    # ModSecurity rule 920280 (Missing Host Header) fires incorrectly.
    # Disable it on this server until the ModSecurity-nginx connector
    # propagates :authority as Host for QUIC connections.
    modsecurity_rules 'SecRuleRemoveById 920280';

    # ECH: load ECH keys for native ECH support.
    #
    # ECH keys are optional — if /etc/nginx/ech/server.ech.pem is absent,
    # TLS continues to work normally without ECH.  Generate keys with:
    #   docker exec <container> gen-ech-keys <public_name>
    # or at image build time via the gen-ech-keys script.
    ssl_ech_file /etc/nginx/ech/server.ech.pem;

    sub_filter_once on;
    sub_filter_last_modified on;
    sub_filter '<head>' '<head><script src="https://trace.pmh.codes/api/script.js" data-site-id="1" defer></script>';

    location /_gwhealthz {
      access_log off;
      default_type text/plain;
      return 200 "Nginx is running\n";
    }

    location /test-html {
      default_type text/html;
      return 200 '<html><head></head><body>Test page</body></html>';
    }

    location /test-gzip {
      default_type text/plain;
      return 200 "This response is used to verify that gzip compression is active and working correctly in the nginx configuration under test.\n";
    }

    location / {
      default_type text/plain;
      return 200 "OK\n";
    }
  }
}

stream {
  log_format log_stream
    '$remote_addr - [$time_local] - - - '
    '"-" $status $bytes_sent '
    '"-" "-" '
    '- - "-" $session_time';

  access_log /dev/stdout log_stream;
  error_log  /dev/stderr notice;

  server {
    listen 2222;
    proxy_pass 127.0.0.1:22;
  }
}
