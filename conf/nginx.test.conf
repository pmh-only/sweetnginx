load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  # Read cert and key files as root (master process) so worker processes
  # don't need filesystem access to them from ssl_certificate_by_lua_block.
  init_by_lua_block {
    local function slurp(p)
      local f = io.open(p, "rb")
      if not f then return nil end
      local d = f:read("*a"); f:close(); return d
    end
    package.loaded["_cert_pem"] = slurp("/etc/nginx/tls/tls.crt")
    package.loaded["_key_pem"]  = slurp("/etc/nginx/tls/tls.key")
    package.loaded["_ech_pem"]  = slurp("/etc/nginx/ech/server.ech.pem")
  }


  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  server_tokens off;
  more_clear_headers Server;

  access_log off;

  client_max_body_size 0;

  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  ssl_ecdh_curve secp384r1;
  ssl_prefer_server_ciphers on;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_early_data on;

  http2 on;
  http3 on;
  http3_hq on;
  quic_retry on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1;
  brotli_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  zstd on;
  zstd_comp_level 3;
  zstd_min_length 1;
  zstd_types
    text/plain text/css text/xml application/xml
    application/json application/javascript text/javascript
    application/manifest+json application/rss+xml image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Accept-Encoding "";

  proxy_read_timeout 86400;
  proxy_send_timeout 86400;
  proxy_request_buffering off;
  proxy_http_version 1.1;

  proxy_buffer_size 1m;
  proxy_buffers 8 1m;
  proxy_busy_buffers_size 2m;

  map $http_x_forwarded_for $ga_xff {
    default $http_x_forwarded_for;
    ""      "-";
  }

  map $upstream_cache_status $ga_cache {
    default $upstream_cache_status;
    ""      "-";
  }

  map $ssl_protocol $ga_ssl_proto {
    default $ssl_protocol;
    ""      "-";
  }

  map $ssl_cipher $ga_ssl_cipher {
    default $ssl_cipher;
    ""      "-";
  }

  map $sent_http_content_type $ga_mime {
    default $sent_http_content_type;
    ""      "-";
  }

  log_format log_stream
    '$remote_addr $ga_xff [$time_local] $host $remote_user $ga_cache '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    '$ga_ssl_proto $ga_ssl_cipher "$ga_mime" $request_time';

  modsecurity on;
  modsecurity_rules_file /etc/modsecurity/includes.conf;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # content_by_lua_block runs in the content phase, AFTER ModSecurity's
    # access phase — unlike `return` which runs in the rewrite phase and
    # bypasses ModSecurity entirely.

    location /_gwhealthz {
      access_log off;
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("Nginx is running")
      }
    }

    location /test-html {
      content_by_lua_block {
        ngx.header.content_type = "text/html"
        ngx.print('<html><head></head><body>Test page</body></html>')
      }
    }

    location /test-gzip {
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("This response is used to verify that gzip compression is active and working correctly in the nginx configuration under test.")
      }
    }

    location / {
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("OK")
      }
    }
  }

  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name _;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # HTTP/3 uses the :authority pseudo-header instead of Host, so
    # ModSecurity rule 920280 (Missing Host Header) fires incorrectly.
    # Disable it on this server until the ModSecurity-nginx connector
    # propagates :authority as Host for QUIC connections.
    modsecurity_rules 'SecRuleRemoveById 920280';

    # ECH: load ECH keys into SSL_CTX once per worker (on the first TLS
    # connection), then set the certificate for every connection.
    #
    # ECH keys are optional — if /etc/nginx/ech/server.ech.pem is absent,
    # TLS continues to work normally without ECH.  Generate keys with:
    #   docker exec <container> gen-ech-keys <public_name>
    # or at image build time via the gen-ech-keys script.
    #
    # --export-dynamic in the nginx link flags makes the statically-linked
    # defo-project OpenSSL ECH symbols (OSSL_ECHSTORE_*, etc.) visible to
    # LuaJIT via ffi.C, so no separate shared library is needed.
    ssl_certificate_by_lua_block {
        local ssl = require "ngx.ssl"
        local ffi = require "ffi"

        -- Per-worker one-time init: FFI types, parse ECH key, convert cert/key to DER.
        if not package.loaded["_ech_init"] then
            package.loaded["_ech_init"] = true

            local ok, err = pcall(function()
                ffi.cdef[[
                    typedef struct ssl_st            SSL;
                    typedef struct ossl_echstore_st  OSSL_ECHSTORE;
                    typedef struct ossl_lib_ctx_st   OSSL_LIB_CTX;
                    typedef struct bio_st            BIO;
                    OSSL_ECHSTORE *OSSL_ECHSTORE_new(OSSL_LIB_CTX *, const char *);
                    void           OSSL_ECHSTORE_free(OSSL_ECHSTORE *);
                    BIO           *BIO_new_mem_buf(const void *buf, int len);
                    void           BIO_free_all(BIO *);
                    int            OSSL_ECHSTORE_read_pem(OSSL_ECHSTORE *, BIO *, int);
                    int            SSL_set1_echstore(SSL *, OSSL_ECHSTORE *);
                ]]

                -- ECH PEM is read by init_by_lua_block (master/root) to avoid
                -- worker permission issues with the key directory.
                local ech_pem = package.loaded["_ech_pem"]
                if ech_pem then
                    local bio = ffi.C.BIO_new_mem_buf(ech_pem, #ech_pem)
                    if bio ~= ffi.null then
                        local es = ffi.C.OSSL_ECHSTORE_new(nil, nil)
                        if es ~= ffi.null then
                            if ffi.C.OSSL_ECHSTORE_read_pem(es, bio, 1) == 1 then
                                -- Cache the store for the worker's lifetime; do not free.
                                -- SSL_set1_echstore is called per-connection below.
                                package.loaded["_ech_store"] = es
                                ngx.log(ngx.INFO, "ECH: keys cached")
                            else
                                ffi.C.OSSL_ECHSTORE_free(es)
                                ngx.log(ngx.WARN, "ECH: failed to parse ECH PEM")
                            end
                        end
                        ffi.C.BIO_free_all(bio)
                    end
                else
                    ngx.log(ngx.INFO, "ECH: key not present; ECH disabled")
                end
            end)
            if not ok then
                ngx.log(ngx.WARN, "ECH: init failed (ECH symbols not available): ", err)
            end

            -- Convert PEM→DER once per worker.
            local cert_pem = package.loaded["_cert_pem"]
            local key_pem  = package.loaded["_key_pem"]
            if cert_pem then package.loaded["_cert_der"] = ssl.cert_pem_to_der(cert_pem) end
            if key_pem  then package.loaded["_key_der"]  = ssl.priv_key_pem_to_der(key_pem) end
        end

        -- Per-connection: apply cached ECH store to this SSL object.
        -- Must run on every connection, not just the first.
        local es = package.loaded["_ech_store"]
        if es then
            local ssl_ptr = ssl.get_req_ssl_pointer and ssl.get_req_ssl_pointer()
            if ssl_ptr then
                ffi.C.SSL_set1_echstore(ffi.cast("struct ssl_st *", ssl_ptr), es)
            else
                ngx.log(ngx.WARN, "ECH: SSL pointer unavailable; ECH not loaded for this connection")
            end
        end

        -- Per-connection: set certificate and key.
        local cert_der = package.loaded["_cert_der"]
        local key_der  = package.loaded["_key_der"]
        if not cert_der or not key_der then
            ngx.log(ngx.ERR, "ssl_certificate_by_lua: no certificate cached")
            return ngx.exit(ngx.ERROR)
        end

        local ok, err = ssl.clear_certs()
        if not ok then
            -- QUIC connections may not support Lua cert injection; fall back
            -- to the static ssl_certificate/ssl_certificate_key directives.
            ngx.log(ngx.INFO, "ssl_certificate_by_lua: clear_certs: ", err, "; using static cert")
            return
        end

        ok, err = ssl.set_der_cert(cert_der)
        if not ok then
            ngx.log(ngx.ERR, "ssl_certificate_by_lua: set_der_cert: ", err)
            return ngx.exit(ngx.ERROR)
        end

        ok, err = ssl.set_der_priv_key(key_der)
        if not ok then
            ngx.log(ngx.ERR, "ssl_certificate_by_lua: set_der_priv_key: ", err)
            return ngx.exit(ngx.ERROR)
        end
    }

    sub_filter_once on;
    sub_filter_last_modified on;
    sub_filter '<head>' '<head><script src="https://trace.pmh.codes/api/script.js" data-site-id="1" defer></script>';

    location /_gwhealthz {
      access_log off;
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("Nginx is running")
      }
    }

    location /test-html {
      content_by_lua_block {
        ngx.header.content_type = "text/html"
        ngx.print('<html><head></head><body>Test page</body></html>')
      }
    }

    location /test-gzip {
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("This response is used to verify that gzip compression is active and working correctly in the nginx configuration under test.")
      }
    }

    location / {
      content_by_lua_block {
        ngx.header.content_type = "text/plain"
        ngx.say("OK")
      }
    }
  }
}

stream {
  log_format log_stream
    '$remote_addr - [$time_local] - - - '
    '"-" $status $bytes_sent '
    '"-" "-" '
    '- - "-" $session_time';

  access_log /dev/stdout log_stream;
  error_log  /dev/stderr notice;

  server {
    listen 2222;
    proxy_pass 127.0.0.1:22;
  }
}
