name: Check for component updates

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest versions
        id: versions
        run: |
          latest_openssl_ech_ref() {
            git ls-remote --tags --refs https://github.com/defo-project/openssl \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ech$' \
              | sort -V \
              | tail -n 1
          }

          NGINX_LATEST=$(curl -sf "https://nginx.org/download/" | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)' | sort -V | tail -1)

          HEADERS_MORE_LATEST=$(curl -sf "https://api.github.com/repos/openresty/headers-more-nginx-module/tags?per_page=5" | jq -r '.[0].name')

          CRS_LATEST=$(curl -sf https://api.github.com/repos/coreruleset/coreruleset/releases/latest \
            | jq -r '.tag_name')

          MODSEC_LATEST=$(curl -sf "https://api.github.com/repos/owasp-modsecurity/ModSecurity/tags?per_page=20" \
            | jq -r '[.[] | select(.name | test("^v3"))][0].name')

          MODSEC_NGINX_LATEST=$(curl -sf "https://api.github.com/repos/owasp-modsecurity/ModSecurity-nginx/tags?per_page=5" \
            | jq -r '.[0].name')

          OPENSSL_ECH_LATEST=$(latest_openssl_ech_ref)

          NGINX_CURRENT=$(grep -oP 'ARG NGINX_VERSION=\K\S+' Dockerfile)
          HEADERS_MORE_CURRENT=$(grep -oP 'ARG HEADERS_MORE_VERSION=\K\S+' Dockerfile)
          CRS_CURRENT=$(grep -oP 'ARG CRS_VERSION=\K\S+' Dockerfile)
          MODSEC_CURRENT=$(grep -oP 'ARG MODSECURITY_VERSION=\K\S+' Dockerfile)
          MODSEC_NGINX_CURRENT=$(grep -oP 'ARG MODSEC_NGINX_VERSION=\K\S+' Dockerfile)
          OPENSSL_ECH_CURRENT=$(grep -oP 'ARG OPENSSL_ECH_TAG=\K\S+' Dockerfile)

          echo "nginx_latest=$NGINX_LATEST"                     >> "$GITHUB_OUTPUT"
          echo "headers_more_latest=$HEADERS_MORE_LATEST"       >> "$GITHUB_OUTPUT"
          echo "crs_latest=$CRS_LATEST"                         >> "$GITHUB_OUTPUT"
          echo "modsec_latest=$MODSEC_LATEST"                   >> "$GITHUB_OUTPUT"
          echo "modsec_nginx_latest=$MODSEC_NGINX_LATEST"       >> "$GITHUB_OUTPUT"
          echo "openssl_ech_latest=$OPENSSL_ECH_LATEST"         >> "$GITHUB_OUTPUT"
          echo "nginx_current=$NGINX_CURRENT"                   >> "$GITHUB_OUTPUT"
          echo "headers_more_current=$HEADERS_MORE_CURRENT"     >> "$GITHUB_OUTPUT"
          echo "crs_current=$CRS_CURRENT"                       >> "$GITHUB_OUTPUT"
          echo "modsec_current=$MODSEC_CURRENT"                 >> "$GITHUB_OUTPUT"
          echo "modsec_nginx_current=$MODSEC_NGINX_CURRENT"     >> "$GITHUB_OUTPUT"
          echo "openssl_ech_current=$OPENSSL_ECH_CURRENT"       >> "$GITHUB_OUTPUT"

          if [ "$NGINX_LATEST"         != "$NGINX_CURRENT" ]         || \
             [ "$HEADERS_MORE_LATEST"  != "$HEADERS_MORE_CURRENT" ]  || \
             [ "$CRS_LATEST"           != "$CRS_CURRENT" ]           || \
             [ "$MODSEC_LATEST"        != "$MODSEC_CURRENT" ]        || \
             [ "$MODSEC_NGINX_LATEST"  != "$MODSEC_NGINX_CURRENT" ]  || \
             [ "$OPENSSL_ECH_LATEST"   != "$OPENSSL_ECH_CURRENT" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update versions
        if: steps.versions.outputs.has_updates == 'true'
        run: |
          sed -i "s/ARG NGINX_VERSION=.*/ARG NGINX_VERSION=${{ steps.versions.outputs.nginx_latest }}/" Dockerfile
          sed -i "s/ARG HEADERS_MORE_VERSION=.*/ARG HEADERS_MORE_VERSION=${{ steps.versions.outputs.headers_more_latest }}/" Dockerfile
          sed -i "s/ARG CRS_VERSION=.*/ARG CRS_VERSION=${{ steps.versions.outputs.crs_latest }}/" Dockerfile
          sed -i "s/ARG MODSECURITY_VERSION=.*/ARG MODSECURITY_VERSION=${{ steps.versions.outputs.modsec_latest }}/" Dockerfile
          sed -i "s/ARG MODSEC_NGINX_VERSION=.*/ARG MODSEC_NGINX_VERSION=${{ steps.versions.outputs.modsec_nginx_latest }}/" Dockerfile
          sed -i "s/ARG OPENSSL_ECH_TAG=.*/ARG OPENSSL_ECH_TAG=${{ steps.versions.outputs.openssl_ech_latest }}/" Dockerfile

          sed -i "s/| nginx | .* |/| nginx | ${{ steps.versions.outputs.nginx_latest }} |/" README.md
          sed -i "s/| headers-more-nginx-module | .* |/| headers-more-nginx-module | ${{ steps.versions.outputs.headers_more_latest }} |/" README.md
          sed -i "s/| ModSecurity | .* |/| ModSecurity | ${{ steps.versions.outputs.modsec_latest }} |/" README.md
          sed -i "s/| ModSecurity-nginx connector | .* |/| ModSecurity-nginx connector | ${{ steps.versions.outputs.modsec_nginx_latest }} |/" README.md
          sed -i "s/| OWASP Core Rule Set | .* |/| OWASP Core Rule Set | ${{ steps.versions.outputs.crs_latest }} |/" README.md
          sed -i "s/| ECH OpenSSL (defo-project) | .* |/| ECH OpenSSL (defo-project) | ${{ steps.versions.outputs.openssl_ech_latest }} |/" README.md

      - name: Create pull request
        if: steps.versions.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update component versions"
          title: "chore: update component versions"
          body: |
            Automated version bump:

            | Component | Current | Latest |
            |-----------|---------|--------|
            | nginx | `${{ steps.versions.outputs.nginx_current }}` | `${{ steps.versions.outputs.nginx_latest }}` |
            | headers-more-nginx-module | `${{ steps.versions.outputs.headers_more_current }}` | `${{ steps.versions.outputs.headers_more_latest }}` |
            | ModSecurity | `${{ steps.versions.outputs.modsec_current }}` | `${{ steps.versions.outputs.modsec_latest }}` |
            | ModSecurity-nginx | `${{ steps.versions.outputs.modsec_nginx_current }}` | `${{ steps.versions.outputs.modsec_nginx_latest }}` |
            | CRS | `${{ steps.versions.outputs.crs_current }}` | `${{ steps.versions.outputs.crs_latest }}` |
            | ECH OpenSSL | `${{ steps.versions.outputs.openssl_ech_current }}` | `${{ steps.versions.outputs.openssl_ech_latest }}` |
          branch: chore/version-updates
          delete-branch: true
          labels: dependencies
